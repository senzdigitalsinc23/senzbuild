version: '3.8'

services:
  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_HOST=db
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    networks:
      - api-network
    depends_on:
      - db
      - redis

  # Nginx Web Server
  nginx:
    image: nginx:1.27-alpine
    container_name: api-nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/conf.d:/etc/nginx/conf.d
    networks:
      - api-network
    depends_on:
      - app

  # MySQL Database
  db:
    image: mysql:8.0
    container_name: api-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: api_project
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: root
      MYSQL_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - api-network

  # Redis Cache
  redis:
    image: redis:alpine
    container_name: api-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - api-network

networks:
  api-network:
    driver: bridge

volumes:
  db_data:
